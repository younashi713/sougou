<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>音のテスト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>音のテスト</h1>

<button id="playButton">再生</button>

<h2>聞こえた内容を入力してください</h2>
<input type="text" id="answerInput">

<button id="checkButton">判定する</button>
<button id="nextButton" style="display:none;">次へ</button>

<h2 id="ratingTitle" style="display:none;">聞きやすさを1〜10で評価してください</h2>
<div id="rating-buttons"></div>

<p id="message"></p>

<script src="sound.js"></script>
</body>
</html>
