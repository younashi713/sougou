<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>色のテスト</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>色のテスト</h1>

<div id="color-box">ここに警報文が表示されます</div>

<h2>表示された内容を選んでください（5択）</h2>
<div id="choice-buttons"></div>

<h2 id="ratingTitle" style="display:none;">見やすさを1〜10で評価してください（1:全く見えない、10:とても見やすい）</h2>
<div id="rating-buttons"></div>

<h2 id="evacTitle" style="display:none;">
もし、この警報が表示されたら、どのくらい避難しようと思いますか？<br>
（1:避難しようとは全く思わない、10:絶対避難しようと思う）
</h2>
<div id="evac-buttons"></div>

<button id="nextButton" style="display:none;">次へ</button>

<p id="message"></p>

<script src="color2.js"></script>
</body>
</html>
